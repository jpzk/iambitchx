name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege: nothing by default. Only the publish job gets
# contents: write; build/sbom jobs (which run third-party build code) are
# read-only and hand their outputs over as workflow artifacts.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        arch: [x86_64, aarch64]
        exclude:
          - platform: windows-latest
            arch: aarch64
        include:
          - platform: ubuntu-latest
            arch: x86_64
            triple: unknown-linux-musl
          - platform: ubuntu-latest
            arch: aarch64
            triple: unknown-linux-gnu
          - platform: macos-latest
            triple: apple-darwin
          - platform: windows-latest
            triple: pc-windows-msvc
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.arch }}-${{ matrix.triple }}
      TAG: ${{ github.ref_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust (stable)
      run: |
        rustup toolchain install stable --profile minimal --target "$TARGET"
        rustup default stable
    - name: Install C cross-compilation toolchain
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt install -f -y build-essential crossbuild-essential-arm64 musl-dev
        # Cross-compilation env vars for x86_64-unknown-linux-musl
        echo CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=x86_64-linux-musl-gcc >> $GITHUB_ENV
        echo AR_x86_64_unknown_linux_musl=x86_64-linux-gnu-ar >> $GITHUB_ENV
        echo CC_x86_64_unknown_linux_musl=x86_64-linux-musl-gcc >> $GITHUB_ENV
        echo CXX_x86_64_unknown_linux_musl=x86_64-linux-gnu-g++ >> $GITHUB_ENV
        # Cross-compilation env vars for aarch64-unknown-linux-gnu
        echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc >> $GITHUB_ENV
        echo AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar >> $GITHUB_ENV
        echo CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc >> $GITHUB_ENV
        echo CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++ >> $GITHUB_ENV
    - name: 'Build: binary'
      run: |
        cargo +stable build --profile=release-lto --locked --target="$TARGET"
    - name: 'Package: tgz'
      # cargo-tar replaced, see docs/ci-supply-chain.md
      run: |
        .github/workflows/package-tar.sh "${TAG#v}" "$TARGET" release-lto dist
    - name: 'Package: deb'
      if: matrix.platform == 'ubuntu-latest'
      run: |
        cargo +stable install cargo-deb --version 3.8.0 --locked
        cargo +stable deb --profile=release-lto --no-strip --target "$TARGET"
        cp ./target/"$TARGET"/debian/iambitchx*.deb dist/
    - name: 'Package: rpm'
      if: matrix.platform == 'ubuntu-latest'
      run: |
        cargo +stable install cargo-generate-rpm --version 0.21.0 --locked
        cargo +stable generate-rpm --profile=release-lto --target "$TARGET"
        cp ./target/"$TARGET"/generate-rpm/iambitchx*.rpm dist/
    - name: Upload packages artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pkg-${{ env.TARGET }}
        path: dist/*
        if-no-files-found: error

  sbom:
    name: SBOM + vulnerability report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust (stable)
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    - name: Install pinned SBOM/audit tools
      # versions + publish dates: docs/ci-supply-chain.md
      run: |
        cargo install cargo-cyclonedx --version 0.5.9 --locked
        cargo install cargo-audit --version 0.22.2 --locked
    - name: Generate CycloneDX SBOM (JSON, spec 1.5)
      # -> dist/iambitchx-<version>.cdx.json (version = tag without leading v)
      run: .github/workflows/sbom.sh "${TAG#v}" dist
    - name: Vulnerability scan (RustSec, never fails the release)
      run: .github/workflows/vuln.sh dist/vuln.json
    - name: Upload SBOM + vuln artifact
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-vuln
        path: |
          dist/*.cdx.json
          dist/vuln.json
        if-no-files-found: error

  publish:
    name: Upload assets to release
    needs: [build, sbom]
    # upload whatever was produced even if one build target failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download build, SBOM and vuln artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        merge-multiple: true
    - name: Upload to release
      run: |
        ls -l dist
        test -f "dist/iambitchx-${TAG#v}.cdx.json"
        test -f dist/vuln.json
        gh release view "$TAG" >/dev/null 2>&1 \
          || gh release create "$TAG" --draft=true --target "$GITHUB_SHA" --title "$TAG"
        gh release upload "$TAG" dist/* --clobber
      env:
        TAG: ${{ github.ref_name }}
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
