on:
  push:
    branches:
      - main

name: Binaries

# Least privilege: build + upload workflow artifacts only, no write scopes.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        arch: [x86_64, aarch64]
        exclude:
          - platform: windows-latest
            arch: aarch64
        include:
          - platform: ubuntu-latest
            arch: x86_64
            triple: unknown-linux-musl
          - platform: ubuntu-latest
            arch: aarch64
            triple: unknown-linux-gnu
          - platform: macos-latest
            triple: apple-darwin
          - platform: windows-latest
            triple: pc-windows-msvc
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.arch }}-${{ matrix.triple }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false
    - name: Install Rust (stable)
      # dtolnay/rust-toolchain removed, see docs/ci-supply-chain.md
      run: |
        rustup toolchain install stable --profile minimal --target "$TARGET"
        rustup default stable
    - name: Install C cross-compilation toolchain
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt install -f -y build-essential crossbuild-essential-arm64 musl-dev
        # Cross-compilation env vars for x86_64-unknown-linux-musl
        echo CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=x86_64-linux-musl-gcc >> $GITHUB_ENV
        echo AR_x86_64_unknown_linux_musl=x86_64-linux-gnu-ar >> $GITHUB_ENV
        echo CC_x86_64_unknown_linux_musl=x86_64-linux-musl-gcc >> $GITHUB_ENV
        echo CXX_x86_64_unknown_linux_musl=x86_64-linux-gnu-g++ >> $GITHUB_ENV
        # Cross-compilation env vars for aarch64-unknown-linux-gnu
        echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc >> $GITHUB_ENV
        echo AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar >> $GITHUB_ENV
        echo CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc >> $GITHUB_ENV
        echo CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++ >> $GITHUB_ENV
    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
    - name: 'Build: binary'
      run: cargo +stable build --release --locked --target "$TARGET"
    - name: 'Upload: binary'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: iambitchx-${{ env.TARGET }}-binary
        path: |
          ./target/${{ env.TARGET }}/release/iambitchx
          ./target/${{ env.TARGET }}/release/iambitchx.exe
    - name: 'Package: tgz'
      # cargo-tar replaced, see docs/ci-supply-chain.md
      run: |
        ver=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
        .github/workflows/package-tar.sh "$ver" "$TARGET" release dist
    - name: 'Upload: tgz'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: iambitchx-${{ env.TARGET }}-tgz
        path: ./dist/iambitchx*-${{ env.TARGET }}.tar.gz
    - name: 'Package: deb'
      if: matrix.platform == 'ubuntu-latest'
      run: |
        cargo +stable install cargo-deb --version 3.8.0 --locked
        cargo +stable deb --no-strip --target "$TARGET"
    - name: 'Upload: deb'
      if: matrix.platform == 'ubuntu-latest'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: iambitchx-${{ env.TARGET }}-deb
        path: ./target/${{ env.TARGET }}/debian/iambitchx*.deb
    - name: 'Package: rpm'
      if: matrix.platform == 'ubuntu-latest'
      run: |
        cargo +stable install cargo-generate-rpm --version 0.21.0 --locked
        cargo +stable generate-rpm --target "$TARGET"
    - name: 'Upload: rpm'
      if: matrix.platform == 'ubuntu-latest'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: iambitchx-${{ env.TARGET }}-rpm
        path: ./target/${{ env.TARGET }}/generate-rpm/iambitchx*.rpm
