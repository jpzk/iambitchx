name: CodeQL

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  schedule:
    # weekly, Monday 05:23 UTC
    - cron: "23 5 * * 1"

# Least privilege: nothing by default; the analyze job gets exactly what
# CodeQL needs. security-events: write exists only here.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust supports build-mode none (no cargo build needed)
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        category: "/language:${{ matrix.language }}"
