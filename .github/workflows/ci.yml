on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # weekly: the macOS leg runs here, off the push path
    - cron: '17 5 * * 1'

name: CI

# least privilege by default; jobs only ever read the repo
permissions:
  contents: read

jobs:
  # macOS hosted runners are capacity-bound: on a push the macos-latest job
  # queues for many minutes and sometimes never starts at all ("the job was
  # not acquired by Runner of type hosted"), which blocks the whole workflow
  # and makes every push look red. Keep the coverage where it is cheap --
  # tags and the weekly schedule -- and keep pushes fast.
  plan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.pick.outputs.platforms }}
    steps:
    - id: pick
      name: pick the platforms
      run: |
        if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.ref_type }}" = "tag" ]; then
          echo 'platforms=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
        else
          echo 'platforms=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
        fi

  test:
    needs: plan
    permissions:
      contents: read
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false
    - name: Install Rust (1.96 w/ clippy + rustfmt)
      shell: bash
      run: |
        rustup toolchain install 1.96 --profile minimal --component clippy --component rustfmt
        rustup default 1.96
    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check imports formatting
      shell: bash
      run: find src -name '*.rs' | xargs ./.github/workflows/check-imports-format.sh
    - name: Check Clippy
      if: matrix.platform == 'ubuntu-latest'
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --locked

  sbom:
    name: SBOM + vulnerability report
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust (stable)
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    - name: Install pinned SBOM/audit tools
      # versions + publish dates: docs/ci-supply-chain.md
      run: |
        cargo install cargo-cyclonedx --version 0.5.9 --locked
        cargo install cargo-audit --version 0.22.2 --locked
    - name: Generate CycloneDX SBOM (JSON, spec 1.5)
      run: .github/workflows/sbom.sh "$GITHUB_SHA" dist
    - name: Vulnerability scan (RustSec, never fails the job)
      run: .github/workflows/vuln.sh dist/vuln.json
    - name: Upload SBOM artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom
        path: dist/*.cdx.json
        if-no-files-found: error
    - name: Upload vulnerability report artifact
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vuln
        path: dist/vuln.json
        if-no-files-found: error
