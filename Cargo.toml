[package]
name = "iambitchx"
version = "0.1.0"
edition = "2024"
authors = ["jpzk"]
repository = "https://github.com/jpzk/iambitchx"
homepage = "https://github.com/jpzk/iambitchx"
readme = "README.md"
description = "A BitchX-style Matrix chat client (fork of iamb by Ulyssa)"
license = "Apache-2.0"
exclude = [".github", "CONTRIBUTING.md"]
keywords = ["matrix", "chat", "tui", "irc", "bitchx"]
categories = ["command-line-utilities"]
rust-version = "1.96"
build = "build.rs"

[[bin]]
name = "iambitchx"
path = "src/main.rs"

[features]
default = ["bundled"]
bundled = ["matrix-sdk/bundled-sqlite"]
max_level_warn = ["tracing/max_level_warn"]
max_level_error = ["tracing/max_level_error"]
max_level_off = ["tracing/max_level_off"]

[build-dependencies.vergen-gitcl]
version = "10.0"
default-features = false
features = ["build"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "^4.6", features = ["derive", "string"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0"
futures = "0.3"
gethostname = "1.1"
libc = "0.2"
open = "5.0.0"
ratatui = "0.30.2"
rpassword = "7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
toml = "1.1"
tracing = "0.1.36"
tracing-appender = "0.2.2"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
unicode-width = "0.2"
url = {version = "2.5.8", features = ["serde"]}

[dependencies.matrix-sdk]
version = "0.20.0"
default-features = false
features = ["e2e-encryption", "socks", "sqlite", "sso-login", "qrcode", "rustls-aws-lc-rs"]

[dependencies.tokio]
version = "1.24.1"
features = ["io-std", "macros", "net", "rt-multi-thread", "sync", "time"]

[profile.release-lto]
inherits = "release"
incremental = false
lto = true

[profile.release-light]
inherits = "release-lto"
opt-level = "z"
strip = true
panic = "abort"

[package.metadata.deb]
section = "net"
license-file = ["LICENSE", "0"]
assets = [
    # Binary:
    ["target/release/iambitchx", "usr/bin/iambitchx", "755"],
    # License:
    ["COPYRIGHT-BITCHX", "usr/share/doc/iambitchx/COPYRIGHT-BITCHX", "644"],
    ["NOTICE", "usr/share/doc/iambitchx/NOTICE", "644"],
    # Manual pages:
    ["docs/iambitchx.1", "usr/share/man/man1/iambitchx.1", "644"],
    ["docs/iambitchx.5", "usr/share/man/man5/iambitchx.5", "644"],
    # Packaged themes:
    [ "themes/*.toml", "usr/share/iambitchx/themes/", "644" ],
    # Other assets:
    ["iambitchx.desktop", "usr/share/applications/iambitchx.desktop", "644"],
    ["config.example.toml", "usr/share/iambitchx/config.example.toml", "644"],
    ["config.full.toml", "usr/share/iambitchx/config.full.toml", "644"],
    ["docs/iambitchx.metainfo.xml", "usr/share/metainfo/iambitchx.metainfo.xml", "644"],
]

[package.metadata.generate-rpm]
version = "0.1.0"
assets = [
    # Binary:
    { source = "target/release/iambitchx", dest = "/usr/bin/iambitchx", mode = "755" },
    # License:
    { source = "LICENSE", dest = "/usr/share/licenses/iambitchx/LICENSE", mode = "644", doc = true },
    { source = "COPYRIGHT-BITCHX", dest = "/usr/share/licenses/iambitchx/COPYRIGHT-BITCHX", mode = "644", doc = true },
    { source = "NOTICE", dest = "/usr/share/licenses/iambitchx/NOTICE", mode = "644", doc = true },
    # Manual pages:
    { source = "docs/iambitchx.1", dest = "/usr/share/man/man1/iambitchx.1", mode = "644" },
    { source = "docs/iambitchx.5", dest = "/usr/share/man/man5/iambitchx.5", mode = "644" },
    # Packaged themes:
    { source = "themes/*.toml", dest = "/usr/share/iambitchx/themes/", mode = "644" },
    # Other assets:
    { source = "iambitchx.desktop", dest = "/usr/share/applications/iambitchx.desktop", mode = "644" },
    { source = "config.example.toml", dest = "/usr/share/iambitchx/config.example.toml", mode = "644"},
    { source = "config.full.toml", dest = "/usr/share/iambitchx/config.full.toml", mode = "644"},
    { source = "docs/iambitchx.metainfo.xml", dest = "/usr/share/metainfo/iambitchx.metainfo.xml", mode = "644"},
]

[package.metadata.tar]
format = "tar.gz"
assets = [
    # License:
    { source = "LICENSE", dest = "LICENSE", mode = "644" },
    { source = "COPYRIGHT-BITCHX", dest = "COPYRIGHT-BITCHX", mode = "644" },
    { source = "NOTICE", dest = "NOTICE", mode = "644" },
    # Manual pages:
    { source = "docs/iambitchx.1", dest = "docs/iambitchx.1", mode = "644" },
    { source = "docs/iambitchx.5", dest = "docs/iambitchx.5", mode = "644" },
    # Packaged themes:
    { source = "themes/*.toml", dest = "themes/", mode = "644" },
    # Other assets:
    { source = "iambitchx.desktop", dest = "assets/iambitchx.desktop", mode = "644" },
    { source = "config.example.toml", dest = "assets/config.example.toml", mode = "644"},
    { source = "config.full.toml", dest = "assets/config.full.toml", mode = "644"},
    { source = "docs/iambitchx.metainfo.xml", dest = "assets/iambitchx.metainfo.xml", mode = "644"},
]

[lints.rust]
# The only unsafe is the libc::umask call in main.rs (locally allowed, with a reason).
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Short allow-list for noisy pedantic lints:
# - module_name_repetitions / must_use_candidate: naming / annotation churn, no correctness value.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# - too_many_lines: big event/render/command matches; splitting them is a refactor, not a lint fix.
too_many_lines = "allow"
# - cast_possible_truncation: TUI geometry is usize -> u16 everywhere; values are bounded by the terminal.
cast_possible_truncation = "allow"
# - struct_excessive_bools: App/status/vars structs mirror BitchX /SET on/off toggles one-to-one.
struct_excessive_bools = "allow"
